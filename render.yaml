services:
  - type: web
    name: khata-ledger
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: khata-ledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: KHATA_DB_PATH
        value: /var/data/khata.db
      - key: OLLAMA_ENABLED
        value: "false"
      - key: OLLAMA_MODEL
        value: gemma3:4b
      - key: ELEVENLABS_MODEL_ID
        value: scribe_v2
      - key: ALLOW_SYNTHETIC_TRACE_DATA
        value: "false"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ATLAS_DATABASE
        value: khata_patterns
      - key: ATLAS_COLLECTION
        value: synthetic_customer_patterns
      - key: ATLAS_VECTOR_INDEX
        value: pattern_vector_index
